<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlocksExplorer</title>
    <!-- Google Fonts: Montserrat (headers) + Open Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Brand palette */
        --coral: #ff5a5f;
        --coral-dark: #e54a4f;
        --teal: #00c2c3;
        --teal-dark: #00a3a4;
        --yellow: #ffd151;
        --lilac: #e0b0ff;

        /* Dark slate surfaces (base + derived shades) */
        --slate: #2f4f4f;
        --slate-page: #16292a;
        --slate-page-2: #102020;
        --panel: #244040;
        --panel-2: #2c4d4d;
        --panel-raised: #36595a;
        --border: rgba(255, 255, 255, 0.1);
        --border-strong: rgba(255, 255, 255, 0.18);

        /* Text on dark surfaces */
        --text: #eef5f4;
        --text-muted: #9fbcbb;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }

      /*
       * Body keeps DARK text on purpose: the sign-in modal from
       * AccountMenuBar is appended to <body> with a white background, so
       * default text must stay readable there. Light text is applied to the
       * app shell container (which owns the dark UI) — see src/App.tsx.
       */
      body {
        font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        margin: 0;
        padding: 0;
        color: var(--slate);
        background-color: #122424;
        /* Vibrant travel-collage frame: coral / teal / yellow / lilac corner
           blocks over a dark base. The dark app panel floats on top and the
           colourful frame shows around its edges (see .app-shell). */
        background-image: radial-gradient(
            70% 62% at -6% -12%,
            var(--coral) 0%,
            rgba(255, 90, 95, 0) 56%
          ),
          radial-gradient(
            66% 58% at 106% -10%,
            var(--teal) 0%,
            rgba(0, 194, 195, 0) 56%
          ),
          radial-gradient(
            64% 60% at -6% 112%,
            var(--yellow) 0%,
            rgba(255, 209, 81, 0) 54%
          ),
          radial-gradient(
            72% 62% at 108% 112%,
            var(--lilac) 0%,
            rgba(224, 176, 255, 0) 58%
          ),
          linear-gradient(160deg, #15292a 0%, #0e1d1d 100%);
        background-attachment: fixed;
        background-repeat: no-repeat;
      }

      h1,
      h2,
      h3,
      h4 {
        font-family: "Montserrat", sans-serif;
        letter-spacing: -0.01em;
      }

      /* ── Travel frame + floating dark panel (matches the reference) ── */
      .bg-decor {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .bg-decor span {
        position: absolute;
        line-height: 1;
        filter: brightness(0); /* render emoji as a flat silhouette */
        opacity: 0.12;
        user-select: none;
      }
      .app-shell {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 56px);
        margin: 28px;
        padding: 18px 34px 36px;
        background: linear-gradient(180deg, #1b3535 0%, #122424 100%);
        border: 1px solid var(--border-strong);
        border-radius: 26px;
        box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
      }
      @media (max-width: 720px) {
        .app-shell {
          margin: 12px;
          padding: 14px 14px 24px;
          border-radius: 20px;
          min-height: calc(100vh - 24px);
        }
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        padding: 6px 2px 16px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
      }
      .topnav {
        display: flex;
        gap: 4px;
        margin: 0 auto; /* centres the nav between brand and account */
        align-items: center;
      }
      .topnav .tab {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 0.86rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 9px 16px;
      }

      /* Icon-only round button (fullscreen, etc.) */
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(11, 21, 21, 0.72);
        border: 1px solid var(--border-strong);
        color: var(--text);
        display: grid;
        place-items: center;
        font-size: 1rem;
        padding: 0;
        cursor: pointer;
        backdrop-filter: blur(6px);
      }
      .icon-btn:not(:disabled):hover {
        background: rgba(11, 21, 21, 0.9);
      }

      /* Yellow Tip-of-the-Day card */
      .tip-yellow {
        background: var(--yellow);
        color: #4a3300;
        border-radius: 14px;
        padding: 14px 16px;
        box-shadow: 0 14px 30px rgba(255, 209, 81, 0.28);
      }
      .tip-yellow .tip-head {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.85;
      }
      .tip-yellow p {
        margin: 4px 0 0;
        font-weight: 700;
        line-height: 1.45;
        color: #2b1f00;
      }

      /* Progress bar + time strip beneath the photo */
      .progress-strip {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 12px;
      }
      .progress-track {
        flex: 1;
        height: 10px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(to right, var(--yellow), var(--coral));
        border-radius: 999px;
        transition: width 0.5s ease;
      }
      .time-left {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--text);
        white-space: nowrap;
      }
      .time-left small {
        display: block;
        font-weight: 700;
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        color: var(--text-muted);
        text-transform: uppercase;
      }


      /* Inputs live only in the white sign-in modal — keep them light. */
      input,
      select {
        padding: 10px 12px;
        margin: 4px;
        border: 1px solid #d7dede;
        border-radius: 8px;
        font-size: 0.95em;
        font-family: "Open Sans", sans-serif;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(0, 194, 195, 0.2);
      }

      /*
       * Default buttons are coral pills. This intentionally themes the
       * AccountMenuBar (Sign In / Sign Out) and the sign-in modal, whose
       * buttons set no inline background/color. App buttons in src/App.tsx
       * set their own inline styles and override this.
       */
      button {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        cursor: pointer;
        border: none;
        border-radius: 999px;
        padding: 10px 18px;
        background: var(--coral);
        color: #fff;
        font-size: 0.95em;
        transition: background 0.15s ease, transform 0.05s ease,
          box-shadow 0.15s ease;
      }
      button:not(:disabled):hover {
        background: var(--coral-dark);
      }
      button:active {
        transform: translateY(1px);
      }
      button:disabled {
        cursor: not-allowed;
        background: #45605f;
        color: #8aa5a4;
        box-shadow: none;
      }

      /* App button variants (used in src/App.tsx). */
      .btn-coral {
        background: var(--coral);
        box-shadow: 0 8px 20px rgba(255, 90, 95, 0.3);
      }
      .btn-coral:not(:disabled):hover {
        background: var(--coral-dark);
      }
      .btn-teal {
        background: var(--teal);
        box-shadow: 0 8px 20px rgba(0, 194, 195, 0.28);
      }
      .btn-teal:not(:disabled):hover {
        background: var(--teal-dark);
      }
      .btn-ghost {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border: 1px solid var(--border-strong);
        box-shadow: none;
      }
      .btn-ghost:not(:disabled):hover {
        background: rgba(255, 255, 255, 0.12);
      }

      /* Top-bar nav pills: active = coral pill, inactive = plain text. */
      .tab {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid transparent;
      }
      .tab:not(:disabled):hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }
      .tab.is-active {
        background: var(--coral);
        color: #fff;
        box-shadow: 0 8px 20px rgba(255, 90, 95, 0.3);
      }

      /* Account menu bar sits inside the dark header — neutralise its light
         inline background/border and present its controls on-brand. */
      .account-menu {
        color: var(--text);
      }
      .account-menu > div > div {
        background: transparent !important;
        border-bottom: none !important;
        padding: 0 !important;
        gap: 14px !important;
      }
      .account-menu span {
        color: var(--text);
        font-weight: 600;
      }
      .account-menu button {
        background: var(--coral);
        border-radius: 999px;
        padding: 9px 18px !important;
        box-shadow: 0 6px 16px rgba(255, 90, 95, 0.3);
      }
      .account-menu button:hover {
        background: var(--coral-dark);
      }

      /* Responsive game layout: photo + map stack on narrow screens. */
      .game-grid {
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 24px;
        margin-top: 16px;
      }
      @media (max-width: 880px) {
        .game-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ── Signed-out hero ── */
      .hero {
        display: flex;
        flex-direction: column;
        gap: 28px;
        padding: 24px 0 8px;
      }
      .hero-main {
        display: grid;
        grid-template-columns: 0.85fr 1.15fr;
        align-items: center;
        gap: 40px;
        background: linear-gradient(135deg, #21413f 0%, #15292a 100%);
        border: 1px solid var(--border-strong);
        border-radius: 24px;
        padding: 40px 44px;
        position: relative;
        overflow: hidden;
      }
      .hero-main::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
            60% 80% at 12% 10%,
            rgba(255, 90, 95, 0.22),
            transparent 60%
          ),
          radial-gradient(
            60% 80% at 95% 90%,
            rgba(0, 194, 195, 0.2),
            transparent 60%
          );
        pointer-events: none;
      }
      @media (max-width: 820px) {
        .hero-main {
          grid-template-columns: 1fr;
          text-align: center;
          padding: 32px 22px;
        }
      }

      /* Floating animated globe */
      .hero-globe {
        position: relative;
        font-size: 9rem;
        line-height: 1;
        justify-self: center;
        animation: hero-float 5s ease-in-out infinite;
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.4));
      }
      .hero-pin {
        position: absolute;
        font-size: 2.2rem;
        animation: hero-orbit 6s ease-in-out infinite;
      }
      .hero-pin-1 {
        top: -6%;
        right: 4%;
        animation-delay: 0s;
      }
      .hero-pin-2 {
        bottom: 6%;
        left: -10%;
        animation-delay: 1.4s;
      }
      .hero-pin-3 {
        top: 38%;
        right: -14%;
        animation-delay: 2.6s;
      }
      @keyframes hero-float {
        0%,
        100% {
          transform: translateY(0) rotate(-3deg);
        }
        50% {
          transform: translateY(-14px) rotate(3deg);
        }
      }
      @keyframes hero-orbit {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-10px) scale(1.12);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero-globe,
        .hero-pin {
          animation: none;
        }
      }

      .hero-copy {
        position: relative;
        z-index: 1;
      }
      .hero-eyebrow {
        display: inline-block;
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 0.72rem;
        letter-spacing: 0.28em;
        color: var(--yellow);
        background: rgba(255, 209, 81, 0.12);
        border: 1px solid rgba(255, 209, 81, 0.4);
        padding: 6px 14px;
        border-radius: 999px;
        margin-bottom: 16px;
      }
      .hero-title {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: clamp(1.8rem, 3.6vw, 2.9rem);
        line-height: 1.08;
        margin: 0 0 14px;
        color: var(--text);
      }
      .hero-sub {
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1.6;
        margin: 0 0 22px;
        max-width: 30em;
      }
      @media (max-width: 820px) {
        .hero-sub {
          margin-left: auto;
          margin-right: auto;
        }
      }
      .hero-cta-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--coral);
        color: #fff;
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 1rem;
        padding: 12px 22px;
        border-radius: 999px;
        box-shadow: 0 10px 26px rgba(255, 90, 95, 0.36);
        animation: hero-pulse 2.4s ease-in-out infinite;
      }
      @keyframes hero-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hero-cta-pill {
          animation: none;
        }
      }

      /* MODES grid (4 colored cards) — used on landing + Play page */
      .modes-section {
        margin-top: 28px;
      }
      .modes-title {
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 1.4rem;
        letter-spacing: 0.06em;
        margin: 0 0 14px;
        color: var(--text);
      }
      .modes-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
      @media (max-width: 880px) {
        .modes-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 480px) {
        .modes-grid {
          grid-template-columns: 1fr;
        }
      }
      .mode-card {
        position: relative;
        border-radius: 18px;
        padding: 22px 20px 56px;
        min-height: 150px;
        color: #fff;
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        font-size: 1.5rem;
        line-height: 1.05;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        cursor: pointer;
        border: none;
        text-align: left;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
        overflow: hidden;
        transition: transform 0.12s ease, box-shadow 0.15s ease;
      }
      .mode-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 38px rgba(0, 0, 0, 0.34);
      }
      .mode-card .mode-text {
        margin: 10px 0 0;
        max-width: 80%;
        font-family: "Open Sans", sans-serif;
        font-weight: 600;
        font-size: 0.88rem;
        line-height: 1.45;
        letter-spacing: 0;
        text-transform: none;
        opacity: 0.92;
      }
      .mode-card .mode-emoji {
        position: absolute;
        right: 14px;
        bottom: 10px;
        font-size: 2.3rem;
        opacity: 0.95;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.25));
      }
      .mode-card.coral {
        background: linear-gradient(160deg, #ff6f73, #e54a4f);
      }
      .mode-card.teal {
        background: linear-gradient(160deg, #1ed6d7, #00a3a4);
      }
      .mode-card.yellow {
        background: linear-gradient(160deg, #ffd151, #f5b400);
        color: #4a3300;
      }
      .mode-card.lilac {
        background: linear-gradient(160deg, #b58cff, #7a5dd1);
      }

      ::selection {
        background: rgba(255, 90, 95, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
